name: Build Plugin

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Force Replace Toolset in Vcxproj
      shell: pwsh
      run: |
        $vcxprojPath = "OverwatchDumpFix/OverwatchDumpFix.vcxproj"
        $content = Get-Content $vcxprojPath -Raw
        
        # استبدال أي إعداد قديم للـ Toolset بـ v143 الحديثة
        $content = $content -replace '<PlatformToolset>.*?</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>'
        
        # ضبط إصدار ويندوز المستهدف
        if ($content -match '<WindowsTargetPlatformVersion>') {
            $content = $content -replace '<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'
        } else {
            $content = $content -replace '</PropertyGroup>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion></PropertyGroup>'
        }
        
        Set-Content $vcxprojPath -Value $content -Encoding UTF8

    - name: Build Solution
      run: msbuild OverwatchDumpFix.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OverwatchDumpFix-Plugin
        path: |
          x64/Release/*.dp64
          x64/Release/*.dll
